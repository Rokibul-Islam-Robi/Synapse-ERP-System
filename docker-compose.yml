version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapse_erp_app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=synapse_erp_db
      - DB_USER=root
      - DB_PASS=secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./mini_inventory_management_system:/var/www/html
    networks:
      - synapse_net

  db:
    image: mysql:8.0
    container_name: synapse_erp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: synapse_erp_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mini_inventory_management_system/database/inventory_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - synapse_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: synapse_erp_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    depends_on:
      - db
    networks:
      - synapse_net

volumes:
  db_data:

networks:
  synapse_net:
    driver: bridge
